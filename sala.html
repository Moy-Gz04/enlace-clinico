<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0A0A0A">
  <title>Sala de espera · Assistant</title>
  <link rel="icon" href="assets/icono-192.png?v=3" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
  <style>
    :root{ --bg:#0A0A0A; --surface:#141414; --line:#262626; --ink:#F5F5F5; --ink-2:#A3A3A3; --ink-3:#6B6B6B; --azul:#3B82F6; --verde:#22C55E;
      --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif; --f-body:"Figtree",ui-sans-serif,system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace; color-scheme:dark }
    *{box-sizing:border-box} html,body{margin:0;min-height:100%}
    body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;padding:clamp(16px,3vw,40px)}
    .sala{max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:clamp(18px,2.5vw,32px)}
    header{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
    .marca{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;letter-spacing:.16em;font-size:15px}
    .marca img{width:30px;height:30px}
    .reloj{margin-left:auto;text-align:right}
    .reloj b{font-family:var(--f-display);font-size:clamp(26px,3.4vw,44px);font-variant-numeric:tabular-nums;display:block;line-height:1}
    .reloj small{color:var(--ink-2)}
    .medico{display:flex;align-items:center;gap:16px}
    .medico .foto{width:64px;height:64px;border-radius:18px;background:#262626 center/cover;flex:none;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:22px}
    .medico h1{font-family:var(--f-display);font-size:clamp(22px,3vw,36px);margin:0;line-height:1.1;text-wrap:balance}
    .medico p{margin:2px 0 0;color:var(--ink-2)}
    .grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(16px,2.5vw,32px)}
    @media (max-width:820px){ .grid{grid-template-columns:1fr} }
    .actual{border-radius:28px;padding:clamp(22px,3vw,40px);background:radial-gradient(120% 120% at 0% 0%,rgba(59,130,246,.35),transparent 60%),#111827;border:1px solid #1E3A8A;display:flex;flex-direction:column;gap:6px;justify-content:center;min-height:300px}
    .etq{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#93C5FD}
    .num-grande{font-family:var(--f-display);font-weight:800;font-size:clamp(110px,16vw,220px);line-height:.9;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
    .ini{font-family:var(--f-mono);font-size:clamp(28px,4vw,52px);font-weight:700;letter-spacing:.08em}
    .actual.vacio .num-grande{font-size:clamp(40px,6vw,72px);color:var(--ink-2)}
    .pulso{display:inline-flex;align-items:center;gap:8px;color:#BFDBFE;font-weight:600}
    .pulso i{width:10px;height:10px;border-radius:50%;background:var(--azul);box-shadow:0 0 0 0 rgba(59,130,246,.7);animation:pulso 1.8s infinite}
    @keyframes pulso{70%{box-shadow:0 0 0 12px rgba(59,130,246,0)}100%{box-shadow:0 0 0 0 rgba(59,130,246,0)}}
    .lista{border-radius:24px;background:var(--surface);border:1px solid var(--line);padding:clamp(16px,2vw,24px);display:flex;flex-direction:column;gap:10px}
    .lista h2{font-family:var(--f-display);font-size:18px;margin:0 0 4px;display:flex;justify-content:space-between;align-items:baseline}
    .lista h2 small{font-family:var(--f-body);font-size:13px;color:var(--ink-2);font-weight:500}
    .turno{display:grid;grid-template-columns:72px minmax(0,1fr) auto;align-items:center;gap:14px;padding:12px 16px;border-radius:16px;background:#1A1A1A;border:1px solid var(--line)}
    .turno b{font-family:var(--f-display);font-size:30px;font-variant-numeric:tabular-nums;line-height:1}
    .turno .ti{font-family:var(--f-mono);font-size:20px;font-weight:700;letter-spacing:.06em}
    .turno .th{color:var(--ink-2);font-size:13px;display:block;font-family:var(--f-body);letter-spacing:0;font-weight:500}
    .chip{font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;letter-spacing:.04em;white-space:nowrap}
    .espera .chip{background:#262626;color:#D4D4D4}
    .consulta{border-color:#1E40AF;background:#0F1A33} .consulta .chip{background:var(--azul);color:#fff}
    .atendido{opacity:.45} .atendido .chip{background:#14301F;color:var(--verde)}
    .cancelado{opacity:.35} .cancelado .ti{text-decoration:line-through} .cancelado .chip{background:#3B1414;color:#F87171}
    .vacio-lista{color:var(--ink-2);padding:24px;text-align:center}
    footer{color:var(--ink-3);font-size:13px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .error{max-width:520px;margin:18vh auto;text-align:center}
    .error h1{font-family:var(--f-display)}
    @media (prefers-reduced-motion:reduce){ .pulso i{animation:none} }
  </style>
</head>
<body>
  <main class="sala" id="sala" aria-live="polite">
    <header><span class="marca"><img src="assets/logo-a-blanco.png" alt="">ASSISTANT</span><div class="reloj"><b id="hora">--:--</b><small id="fecha"></small></div></header>
    <p style="color:var(--ink-2)">Cargando la sala de espera…</p>
  </main>
  <script src="assets/config.js?v=2"></script>
  <script src="sala.js?v=1"></script>
</body>
</html>
